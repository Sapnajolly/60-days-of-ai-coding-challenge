<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Momentum — AI Habit &amp; Goal Coach</title>
<style>
  :root {
    --bg: #f7f7f5; --fg: #1b1b1b; --muted: #6b6b6b; --card: #ffffff;
    --border: #e4e4e0; --accent: #d9622b; --accent-fg: #ffffff; --danger: #c1432c; --good: #2f9e58; --radius: 10px;
    font-size: 16px;
  }
  html[data-theme="dark"] {
    --bg: #14151a; --fg: #f1f1ef; --muted: #9a9a9a; --card: #1d1e24;
    --border: #2c2d34; --accent: #e8804a; --accent-fg: #14151a; --danger: #e8674a; --good: #4cc47c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 1.1rem; margin: 0; }
  header h1 span { color: var(--accent); }
  nav { display: flex; gap: 8px; }
  nav button { background: none; border: 1px solid var(--border); color: var(--fg); padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-size: 0.85rem; }
  nav button.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  #theme-toggle { border: 1px solid var(--border); background: none; color: var(--fg); border-radius: var(--radius); padding: 6px 10px; cursor: pointer; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 24px 80px; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 16px; }
  .empty-state h2 { color: var(--fg); font-size: 1.05rem; margin-bottom: 8px; }
  form.add-goal { display: flex; gap: 8px; }
  form.add-goal input { flex: 1; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 0.9rem; }
  form.add-goal button { padding: 10px 16px; border-radius: var(--radius); border: none; background: var(--accent); color: var(--accent-fg); cursor: pointer; font-weight: 600; }
  .goal-card { display: flex; flex-direction: column; gap: 10px; }
  .goal-card .goal-head { display: flex; justify-content: space-between; align-items: center; }
  .goal-card .goal-head h3 { margin: 0; font-size: 1rem; }
  .goal-card .goal-actions button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; margin-left: 8px; }
  .goal-card .goal-actions button.delete { color: var(--danger); }
  .habit-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); font-size: 0.88rem; gap: 10px; }
  .habit-row .habit-main { display: flex; align-items: center; gap: 10px; }
  .habit-row .streak { font-size: 0.75rem; color: var(--muted); }
  .habit-row .streak.on { color: var(--good); font-weight: 600; }
  .checkin-btn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); cursor: pointer; color: var(--muted); font-size: 0.8rem; }
  .checkin-btn.done { background: var(--good); border-color: var(--good); color: white; }
  .category-tag { display: inline-block; font-size: 0.7rem; color: var(--muted); border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px; margin-left: 8px; }
  .heatmap { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 12px; }
  .heatmap .week { display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; }
  .heatmap .cell { width: 100%; aspect-ratio: 1; border-radius: 3px; background: var(--border); }
  .heatmap .cell[data-level="1"] { background: color-mix(in srgb, var(--good) 30%, var(--border)); }
  .heatmap .cell[data-level="2"] { background: color-mix(in srgb, var(--good) 65%, var(--border)); }
  .heatmap .cell[data-level="3"] { background: var(--good); }
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 24px; }
</style>
</head>
<body>
  <header>
    <h1>Momentum<span>.</span></h1>
    <nav id="main-nav">
      <button data-panel="goals" class="active">Goals</button>
      <button data-panel="coach">Coach</button>
      <button data-panel="stats">Stats</button>
    </nav>
    <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
  </header>

  <main id="app-root"></main>

  <footer>Momentum · Capstone Day 55 · Check-ins, streaks &amp; heatmap · data stays on this device (localStorage)</footer>

<script>
/* ===================== storage.js ===================== */
const Storage = (() => {
  const KEY = "momentum_state_v1";
  function defaultState() { return { goals: [], habits: [], checkIns: [], weeklyReports: [], theme: "light" }; }
  function loadState() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaultState();
      return { ...defaultState(), ...JSON.parse(raw) };
    } catch (e) { console.warn("[Momentum] failed to load state, starting fresh:", e); return defaultState(); }
  }
  let saveTimer = null;
  function saveState(state) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(state)); }
      catch (e) { console.error("[Momentum] failed to save state:", e); }
    }, 250);
  }
  return { loadState, saveState };
})();

/* ===================== date utils (local-midnight safe) ===================== */
function todayKey(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  d.setHours(0, 0, 0, 0);
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

/* ===================== coach.js ===================== */
const Coach = (() => {
  const TEMPLATES = [
    { keywords: ["run", "5k", "marathon", "fit", "gym", "workout", "exercise", "weight"], category: "fitness",
      habits: ["Move for 20 minutes", "Track today's workout", "Stretch for 5 minutes"] },
    { keywords: ["learn", "spanish", "language", "course", "study", "read", "book"], category: "learning",
      habits: ["Study for 25 minutes", "Review yesterday's notes", "Practice one new concept out loud"] },
    { keywords: ["ship", "build", "launch", "project", "app", "startup", "side project", "code"], category: "project",
      habits: ["Work on the project for 30 minutes", "Write down today's next concrete step", "Commit or save progress"] },
    { keywords: ["sleep", "meditat", "journal", "health", "water", "diet", "eat"], category: "health",
      habits: ["Log how you feel today", "Drink a full glass of water on waking", "5 minutes of quiet before bed"] },
  ];
  const GENERIC = { category: "general", habits: ["Spend 15 minutes on this goal", "Write one sentence of progress", "Review tomorrow's plan tonight"] };

  function suggestHabits(goalTitle) {
    const lower = (goalTitle || "").toLowerCase();
    const match = TEMPLATES.find((t) => t.keywords.some((k) => lower.includes(k)));
    const chosen = match || GENERIC;
    const now = Date.now();
    return chosen.habits.map((title, i) => ({ id: `h_${now}_${i}`, title, cadence: "daily", category: chosen.category }));
  }
  function generateWeeklyPlan(state) { return ""; }   // Day 56
  function generateReflection(state) { return ""; }   // Day 56
  return { suggestHabits, generateWeeklyPlan, generateReflection };
})();

/* ===================== heatmap.js =====================
   Pure function: checkIns for one habit -> last 8 weeks grid (Sun-Sat columns).
   Returns 8 weeks x 7 days of { date, level } where level 0=none 1..3=done buckets
   (single-habit heatmap only has 0 or "done", but the 0-3 scale is kept so the
   Day 56 stats view can reuse this for a multi-habit completion-% heatmap too). */
const Heatmap = (() => {
  function buildGrid(checkIns, habitId, weeks = 8) {
    const doneDates = new Set(checkIns.filter((c) => c.habitId === habitId && c.done).map((c) => c.date));
    const days = [];
    for (let i = weeks * 7 - 1; i >= 0; i--) {
      const key = todayKey(-i);
      days.push({ date: key, level: doneDates.has(key) ? 3 : 0 });
    }
    // chunk into weeks of 7 for column rendering
    const grid = [];
    for (let i = 0; i < days.length; i += 7) grid.push(days.slice(i, i + 7));
    return grid;
  }
  return { buildGrid };
})();

/* ===================== streaks ===================== */
function computeStreak(checkIns, habitId) {
  const doneDates = new Set(checkIns.filter((c) => c.habitId === habitId && c.done).map((c) => c.date));
  let streak = 0;
  for (let i = 0; ; i++) {
    const key = todayKey(-i);
    if (doneDates.has(key)) streak++;
    else break;
  }
  return streak;
}

/* ===================== app.js ===================== */
const App = (() => {
  let state = Storage.loadState();
  let activePanel = "goals";
  let expandedHabitId = null; // which habit's heatmap is open

  const root = document.getElementById("app-root");
  const nav = document.getElementById("main-nav");
  const themeToggle = document.getElementById("theme-toggle");

  function applyTheme() {
    document.documentElement.dataset.theme = state.theme;
    themeToggle.textContent = state.theme === "dark" ? "☀️" : "🌙";
  }

  function habitsForGoal(goalId) { return state.habits.filter((h) => h.goalId === goalId); }
  function isDoneToday(habitId) {
    return state.checkIns.some((c) => c.habitId === habitId && c.date === todayKey() && c.done);
  }

  function renderHeatmap(habitId) {
    const grid = Heatmap.buildGrid(state.checkIns, habitId);
    const cols = grid.map((week) => `
      <div class="week">
        ${week.map((d) => `<div class="cell" data-level="${d.level}" title="${d.date}"></div>`).join("")}
      </div>`).join("");
    return `<div class="heatmap">${cols}</div>`;
  }

  function renderGoals() {
    const addForm = `
      <form class="add-goal" id="add-goal-form">
        <input id="goal-input" type="text" maxlength="80" placeholder="e.g. Run a 5K, Ship my side project, Learn Spanish" required />
        <button type="submit">Add goal</button>
      </form>`;

    if (state.goals.length === 0) {
      return `<div class="card">${addForm}</div>
        <div class="card empty-state"><h2>No goals yet</h2><p>Add one above — Momentum breaks it into 3 trackable daily habits automatically.</p></div>`;
    }

    const goalCards = state.goals.map((g) => {
      const habits = habitsForGoal(g.id);
      const rows = habits.map((h) => {
        const streak = computeStreak(state.checkIns, h.id);
        const done = isDoneToday(h.id);
        const heat = expandedHabitId === h.id ? renderHeatmap(h.id) : "";
        return `
          <div>
            <div class="habit-row">
              <div class="habit-main">
                <button class="checkin-btn ${done ? "done" : ""}" data-action="toggle-checkin" data-id="${h.id}" title="Check in today">${done ? "✓" : ""}</button>
                <span class="habit-title">${escapeHtml(h.title)}</span>
              </div>
              <div>
                <span class="streak ${streak > 0 ? "on" : ""}">${streak > 0 ? `🔥 ${streak}d` : "no streak"}</span>
                <button data-action="toggle-heatmap" data-id="${h.id}" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.75rem;margin-left:8px;">${expandedHabitId === h.id ? "hide" : "history"}</button>
              </div>
            </div>
            ${heat}
          </div>`;
      }).join("");
      return `
        <div class="card goal-card" data-goal-id="${g.id}">
          <div class="goal-head">
            <h3>${escapeHtml(g.title)}<span class="category-tag">${habits[0] ? habits[0].category : "general"}</span></h3>
            <div class="goal-actions"><button class="delete" data-action="delete-goal" data-id="${g.id}">Delete</button></div>
          </div>
          ${rows}
        </div>`;
    }).join("");

    return `<div class="card">${addForm}</div>${goalCards}`;
  }

  function renderCoachEmpty() {
    return `<div class="card empty-state"><h2>No coaching yet</h2><p>The weekly AI Coach panel ships on Day 56, once there is real check-in data to reason about.</p></div>`;
  }
  function renderStatsEmpty() {
    return `<div class="card empty-state"><h2>No stats yet</h2><p>The stats dashboard ships alongside the Coach panel on Day 56.</p></div>`;
  }

  function escapeHtml(str) { const div = document.createElement("div"); div.textContent = str; return div.innerHTML; }

  function render() {
    if (activePanel === "goals") root.innerHTML = renderGoals();
    if (activePanel === "coach") root.innerHTML = renderCoachEmpty();
    if (activePanel === "stats") root.innerHTML = renderStatsEmpty();

    [...nav.querySelectorAll("button")].forEach((btn) => btn.classList.toggle("active", btn.dataset.panel === activePanel));

    const form = document.getElementById("add-goal-form");
    if (form) form.addEventListener("submit", onAddGoal);
    root.querySelectorAll('[data-action="delete-goal"]').forEach((btn) => btn.addEventListener("click", () => onDeleteGoal(btn.dataset.id)));
    root.querySelectorAll('[data-action="toggle-checkin"]').forEach((btn) => btn.addEventListener("click", () => onToggleCheckin(btn.dataset.id)));
    root.querySelectorAll('[data-action="toggle-heatmap"]').forEach((btn) => btn.addEventListener("click", () => {
      expandedHabitId = expandedHabitId === btn.dataset.id ? null : btn.dataset.id;
      render();
    }));
  }

  function onAddGoal(e) {
    e.preventDefault();
    const input = document.getElementById("goal-input");
    const title = input.value.trim();
    if (!title) return;
    const goal = { id: `g_${Date.now()}`, title, createdAt: new Date().toISOString() };
    const newHabits = Coach.suggestHabits(title).map((h) => ({ ...h, goalId: goal.id }));
    state.goals = [...state.goals, goal];
    state.habits = [...state.habits, ...newHabits];
    Storage.saveState(state);
    render();
  }

  function onDeleteGoal(goalId) {
    state.goals = state.goals.filter((g) => g.id !== goalId);
    state.habits = state.habits.filter((h) => h.goalId !== goalId);
    const remainingHabitIds = new Set(state.habits.map((h) => h.id));
    state.checkIns = state.checkIns.filter((c) => remainingHabitIds.has(c.habitId));
    Storage.saveState(state);
    render();
  }

  function onToggleCheckin(habitId) {
    const key = todayKey();
    const existing = state.checkIns.find((c) => c.habitId === habitId && c.date === key);
    if (existing) {
      existing.done = !existing.done;
    } else {
      state.checkIns = [...state.checkIns, { habitId, date: key, done: true }];
    }
    Storage.saveState(state);
    render();
  }

  function wireEvents() {
    nav.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-panel]");
      if (!btn) return;
      activePanel = btn.dataset.panel;
      render();
    });
    themeToggle.addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      Storage.saveState(state);
      applyTheme();
    });
  }

  function boot() {
    applyTheme();
    wireEvents();
    render();
    console.log("[Momentum] Day 55 booted — check-ins, streaks, heatmap live. State:", state);
  }

  return { boot };
})();

App.boot();
</script>
</body>
</html>
