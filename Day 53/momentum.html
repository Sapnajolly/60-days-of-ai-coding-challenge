<!doctype html>
<html lang="en" data-theme="light">

<style>
  :root {
    --bg: #f7f7f5;
    --fg: #1b1b1b;
    --muted: #6b6b6b;
    --card: #ffffff;
    --border: #e4e4e0;
    --accent: #d9622b;
    --accent-fg: #ffffff;
    --radius: 10px;
    font-size: 16px;
  }
  html[data-theme="dark"] {
    --bg: #14151a;
    --fg: #f1f1ef;
    --muted: #9a9a9a;
    --card: #1d1e24;
    --border: #2c2d34;
    --accent: #e8804a;
    --accent-fg: #14151a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  header h1 span { color: var(--accent); }
  nav { display: flex; gap: 8px; }
  nav button {
    background: none;
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 6px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 0.85rem;
  }
  nav button.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  #theme-toggle {
    border: 1px solid var(--border);
    background: none;
    color: var(--fg);
    border-radius: var(--radius);
    padding: 6px 10px;
    cursor: pointer;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 24px 80px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 16px; }
  .empty-state h2 { color: var(--fg); font-size: 1.05rem; margin-bottom: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 24px; }
</style>
</head>
<body>

      <button data-panel="goals" class="active">Goals</button>

  <footer>Momentum · Capstone Day 53 (scaffold) · data stays on this device (localStorage)</footer>

<script>
/* =========================================================================
   storage.js — the only code that touches localStorage
   ========================================================================= */
const Storage = (() => {
  const KEY = "momentum_state_v1";

  function defaultState() {
    return { goals: [], habits: [], checkIns: [], weeklyReports: [], theme: "light" };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      // defensive merge so a partially-corrupt blob never crashes the app
      return { ...defaultState(), ...parsed };
    } catch (e) {
      console.warn("[Momentum] failed to load state, starting fresh:", e);
      return defaultState();
    }
  }

  let saveTimer = null;
  function saveState(state) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
      } catch (e) {
        console.error("[Momentum] failed to save state:", e);
      }
    }, 250);
  }

  return { loadState, saveState };
})();

/* =========================================================================
   coach.js — pure functions, implemented in full on Day 54 / Day 56.
   Stubbed now so app.js has a stable interface to call against.
   ========================================================================= */

  function generateReflection(state) {

   ========================================================================= */
const Heatmap = (() => {
  function buildGrid(checkIns) {
    // Day 55 implements the last-8-weeks grid.
    return [];
  }
  return { buildGrid };
})();

/* =========================================================================
   app.js — state, rendering, event wiring
   ========================================================================= */
const App = (() => {
  let state = Storage.loadState();
  let activePanel = "goals";

  const root = document.getElementById("app-root");
  const nav = document.getElementById("main-nav");
  const themeToggle = document.getElementById("theme-toggle");

  function applyTheme() {
    document.documentElement.dataset.theme = state.theme;
    themeToggle.textContent = state.theme === "dark" ? "☀️" : "🌙";
  }

  function renderGoalsEmpty() {
    return `
      <div class="card empty-state">
        <h2>No goals yet</h2>
        <p>Goal creation and AI habit breakdown ship on Day 54.<br/>This is the Day 53 scaffold — it boots, persists theme, and renders empty states.</p>
      </div>`;
  }

  function renderCoachEmpty() {
    return `
      <div class="card empty-state">
        <h2>No coaching yet</h2>
        <p>The weekly AI Coach panel ships on Day 56, once there is real check-in data to reason about.</p>
      </div>`;
  }

  function renderStatsEmpty() {
    return `
      <div class="card empty-state">
        <h2>No stats yet</h2>
        <p>The stats dashboard ships alongside the Coach panel on Day 56.</p>
      </div>`;
  }

  function render() {
    if (activePanel === "goals") root.innerHTML = renderGoalsEmpty();
    if (activePanel === "coach") root.innerHTML = renderCoachEmpty();
    if (activePanel === "stats") root.innerHTML = renderStatsEmpty();

    [...nav.querySelectorAll("button")].forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.panel === activePanel);
    });
  }

  function wireEvents() {
    nav.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-panel]");
      if (!btn) return;
      activePanel = btn.dataset.panel;
      render();
    });

    themeToggle.addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      Storage.saveState(state);
      applyTheme();
    });
  }

  function boot() {
    applyTheme();
    wireEvents();
    render();
    console.log("[Momentum] Day 53 scaffold booted. State:", state);
  }

  return { boot };
})();

App.boot();
</script>

</html>
